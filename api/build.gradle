plugins {
    id 'java'
}

java {

    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // No external dependencies for the API module
    // Keep it lightweight and platform-agnostic
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}
repositories {
    mavenCentral()
}
