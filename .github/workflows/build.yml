name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: kombat-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            platform/bukkit/build/libs/Kombat-Bukkit-*.jar
            platform/folia/build/libs/Kombat-Folia-*.jar
            platform/minestorm/build/libs/Kombat-Minestom-*.jar

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: "**/build/reports/tests/"
