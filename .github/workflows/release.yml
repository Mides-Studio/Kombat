name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew clean build "-PversionOverride=${version}" --no-daemon

      - name: Prepare distributions
        shell: bash
        run: |
          mkdir -p release
          cp platform/bukkit/build/libs/Kombat-Bukkit-*.jar release/
          cp platform/folia/build/libs/Kombat-Folia-*.jar release/
          cp platform/minestorm/build/libs/Kombat-Minestom-*.jar release/
          cd release
          sha256sum ./*.jar > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --verify-tag \
              --generate-notes \
              --title "Kombat ${version}"
          fi
