name: Bug report
description: Report reproducible broken behavior in Kombat.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Bukkit-compatible / Paper
        - Folia
        - Minestom
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include the Kombat, server, Minecraft, and Java versions.
      placeholder: Kombat 1.0.0, Paper 1.21.10, Java 21
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence that triggers the issue.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or configuration
      render: shell
